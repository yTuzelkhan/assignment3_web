<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 { font-size: 24px; }
        p { font-size: 16px; }

        @media (min-width: 768px) {
            h1 { font-size: 32px; }
            p { font-size: 20px; }
        }

        @media (min-width: 992px) {
            h1 { font-size: 40px; }
            p { font-size: 24px; }
        }

        .box-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between; 
            margin-top: 30px;
        }

        .box {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            border-radius: 5px;
            margin-bottom: 20px; 
            
            flex-basis: 100%; 
        }

        @media (min-width: 768px) {
            .box {
                flex-basis: 48%; 
            }
        }

        @media (min-width: 992px) {
            .box {
                flex-basis: 31%; 
            }
        }
    </style>
</head>
<body>
    <h1>Media Queries</h1>
    <p>This paragraph changes its font size based on the screen width (Mobile, Tablet, Desktop)</p>

    <div class="box-container">
        <div class="box"><a href="index.html" style="text-decoration: none; color: white;">Media Queries</a></div>
        <div class="box"><a href="index1.html" style="text-decoration: none; color: white;">Bootstrap</a></div>
        <div class="box"><a href="index2.html" style="text-decoration: none; color: white;">Portfolio</a></div>
    </div>
</body>
</html>
